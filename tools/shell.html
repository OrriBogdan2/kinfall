<title>Kinfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One dark game screen: the canvas fills the frame, a quiet loader sits on top until the engine starts. */
:root{--void:#0b0f14;--ink:#e9e4d6;--muted:#8d95a3;--ember:#f2a24a;--moss:#7fc28a;--font-ui:"Lilita One","Trebuchet MS",sans-serif;color-scheme:dark}
html,body{height:100%;background:var(--void);color:var(--ink);overflow:hidden}
#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--void);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#load .box{display:grid;gap:14px;justify-items:center;text-align:center;max-width:440px}
#load h1{font:400 52px/1 var(--font-ui);letter-spacing:.02em;margin:0;color:var(--ember)}
#load p{margin:0;color:var(--muted);font:14px/1.5 system-ui,sans-serif}
#bar{width:min(320px,80vw);height:6px;border-radius:3px;background:#1d2530;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--moss);transition:width .2s}
#err{color:#ff9b8a;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace}
#phone{display:none}
@media (max-width:700px),(pointer:coarse){#phone{display:block}}
@media (prefers-reduced-motion:reduce){#bar i{transition:none}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<canvas id="canvas" tabindex="0">Your browser does not support the canvas.</canvas>
<div id="load"><div class="box"><h1>Kinfall</h1><div id="bar"><i></i></div><p id="msg">Loading the game (about 10MB)</p><p id="phone">Kinfall needs a keyboard and mouse. Open it on a computer to play.</p><div id="err" hidden></div></div></div>
<script>
// Files over 15MB can't be published, so the engine ships gzipped and is inflated here.
(function(){const real=window.fetch.bind(window);
  window.fetch=async function(input,init){const url=typeof input==='string'?input:input.url;const m=/(?:^|\/)(index\.(wasm|pck))(\?|$)/.exec(url);
    if(!m)return real(input,init);const r=await real(m[1].replace('.','-')+'.gz.wasm',init);if(!r.ok)return r;
    const body=r.body.pipeThrough(new DecompressionStream('gzip'));
    return new Response(body,{status:200,headers:{'Content-Type':m[2]==='wasm'?'application/wasm':'application/octet-stream'}})}})();

// The game calls these through Godot's JavaScriptBridge.
window.kinBridge=(function(){
  let samplePromise=null;
  // a capability that wasn't ready yet is asked for again next time instead of being written off
  const getSample=()=>{if(!samplePromise)samplePromise=(window.claude&&window.claude.use)?window.claude.use('sample').catch(()=>null):Promise.resolve(null);
    return samplePromise.then(s=>{if(!s)samplePromise=null;return s})};
  // ---- Claude for kin conversations. Answers {text, err} so the game can say why it fell back.
  function ask(payload,cb){(async()=>{try{const s=await getSample();if(!s){cb(JSON.stringify({text:'',err:window.claude?'not_granted':'no_page'}));return}
      const p=JSON.parse(payload);const r=await s(p.messages,{modelTier:p.tier||'quick',cache:false});const t=(r&&r.text)||'';cb(JSON.stringify({text:t,err:t?'':'empty'}))}
    catch(e){cb(JSON.stringify({text:'',err:String((e&&e.code)||'error')}))}})()}
  // ---- online play: the artifact room when available, a BroadcastChannel between tabs otherwise
  let room=null,match=null,me=Math.random().toString(36).slice(2,10),onMsg=null,onPeers=null,peers=new Map(),bc=null,mine={},bcTimer=null;
  function deliver(topic,data,from){if(from===me||!onMsg)return;try{onMsg(JSON.stringify({t:topic,d:data,f:from}))}catch(e){}}
  function emitPeers(){if(!onPeers)return;const arr=[];peers.forEach((v,k)=>arr.push({id:k,p:v}));onPeers(JSON.stringify({me,peers:arr}))}
  async function netStart(msgCb,peersCb){onMsg=msgCb;onPeers=peersCb;
    try{const c=window.claude;room=c&&c.use?await c.use('room'):null}catch(e){room=null}
    if(room){room.onPeers(ch=>{peers=new Map();for(const p of ch.peers){if(p.isMe)me=String(p.peer);const pr=p.presence||{};if(pr.kf)peers.set(String(p.peer),pr)}emitPeers()});
      for(const t of['start','lobby'])room.on(t,msg=>{if(!msg.isMe)deliver(t,msg.data,String(msg.peer))});
      return 'room'}
    bc=new BroadcastChannel('kinfall-net');bc.onmessage=e=>{const m=e.data;if(!m)return;
      if(m.k==='pres'){peers.set(m.f,Object.assign({},m.d,{seen:Date.now()}));emitPeers()}
      else if(m.k==='bye'){peers.delete(m.f);emitPeers()}
      else if(m.k==='msg'&&(!m.room||m.room===(match&&match.name)))deliver(m.t,m.d,m.f)};
    bcTimer=setInterval(()=>{bc.postMessage({k:'pres',f:me,d:mine});const now=Date.now();let ch=false;peers.forEach((v,k)=>{if(now-v.seen>4000){peers.delete(k);ch=true}});if(ch)emitPeers()},1000);
    addEventListener('beforeunload',()=>bc&&bc.postMessage({k:'bye',f:me}));
    return 'tabs'}
  function presence(json){mine=JSON.parse(json);mine.kf=1;if(room)room.presence(mine).catch(()=>{});else if(bc){bc.postMessage({k:'pres',f:me,d:mine});peers.set(me,Object.assign({},mine,{seen:Date.now()}));emitPeers()}}
  function emit(topic,json){const d=JSON.parse(json);if(room)room.emit(topic,d).catch(()=>{});else if(bc)bc.postMessage({k:'msg',t:topic,d,f:me})}
  async function joinMatch(name){leaveMatch();if(room&&room.join){const r=await room.join(name);match={name,r};
      for(const t of['st','hit','ev'])r.on(t,msg=>{if(!msg.isMe)deliver(t,msg.data,String(msg.peer))})}else{match={name}}return 1}
  function matchEmit(topic,json){const d=JSON.parse(json);if(match&&match.r)match.r.emit(topic,d).catch(()=>{});else if(bc)bc.postMessage({k:'msg',t:topic,d,f:me,room:match&&match.name})}
  function leaveMatch(){if(match&&match.r&&match.r.leave)try{match.r.leave()}catch(e){}match=null}
  function whoami(){return me}
  // ---- shared store for islands, guilds and the town: the artifact's db when the page has it,
  // localStorage otherwise (one browser only, so tabs can still visit each other while testing).
  let db=null,uid=null,storeMode='';
  const LS='kfdb:';
  function lsKey(p){return LS+p}
  function lsKids(col){const out=[];const pre=lsKey(col)+'/';const depth=col.split('/').length+1;
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k.startsWith(pre))continue;const path=k.slice(LS.length);
      if(path.split('/').length!==depth)continue;try{out.push({id:path.split('/').pop(),data:JSON.parse(localStorage.getItem(k))})}catch(e){}}return out}
  async function storeInit(cb){try{const c=window.claude;
      if(c&&c.use){const [d,u]=await Promise.all([c.use('db'),c.use('user')]);if(d&&u){const id=await u.id();if(id){db=d;uid=id;storeMode='db'}}}}catch(e){db=null}
    if(!db){storeMode='local';const hu=/uid=(\w+)/.exec(location.hash);uid=hu?hu[1]:localStorage.getItem('kf-uid');if(!uid){uid='u'+Math.random().toString(36).slice(2,12);localStorage.setItem('kf-uid',uid)}}
    let owner=!db;try{const c=window.claude;const u=c&&c.use?await c.use('user'):null;if(u&&u.isOwner)owner=!!(await u.isOwner())}catch(e){}
    cb(JSON.stringify({mode:storeMode,me:uid,owner}))}
  function cmp(a,op,b){switch(op){case'==':return a===b;case'!=':return a!==b;case'<':return a<b;case'<=':return a<=b;case'>':return a>b;case'>=':return a>=b;case'array-contains':return Array.isArray(a)&&a.includes(b);case'in':return Array.isArray(b)&&b.includes(a)}return false}
  async function dbGet(path,cb){try{if(db){const s=await db.doc(path).get();cb(s.exists?JSON.stringify(s.data()):'null')}else{cb(localStorage.getItem(lsKey(path))||'null')}}catch(e){cb('null')}}
  async function dbSet(path,json,cb){try{const d=JSON.parse(json);if(db)await db.doc(path).set(d);else localStorage.setItem(lsKey(path),JSON.stringify(d));cb('ok')}catch(e){cb('err:'+((e&&e.code)||'x'))}}
  async function dbDel(path,cb){try{if(db)await db.doc(path).delete();else localStorage.removeItem(lsKey(path));cb('ok')}catch(e){cb('err:'+((e&&e.code)||'x'))}}
  async function dbAdd(col,json,cb){try{const d=JSON.parse(json);if(db){const r=await db.collection(col).add(d);cb(r.id)}else{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);localStorage.setItem(lsKey(col+'/'+id),JSON.stringify(d));cb(id)}}catch(e){cb('')}}
  async function dbQuery(col,qjson,cb){try{const q=JSON.parse(qjson);let rows;
      if(db){let r=db.collection(col);for(const f of(q.where||[]))r=r.where(f[0],f[1],f[2]);if(q.order)r=r.orderBy(q.order,q.dir||'asc');r=r.limit(Math.min(q.limit||50,200));
        const s=await r.get();rows=s.docs.map(d=>({id:d.id,data:d.data()}))}
      else{rows=lsKids(col).filter(r=>(q.where||[]).every(f=>cmp(r.data[f[0]],f[1],f[2])));
        if(q.order){const k=q.order,dir=q.dir==='desc'?-1:1;rows.sort((a,b)=>((a.data[k]??0)>(b.data[k]??0)?1:-1)*dir)}rows=rows.slice(0,q.limit||50)}
      cb(JSON.stringify(rows))}catch(e){cb('[]')}}
  // Claim a document before acting on it (buying a market listing): only one buyer gets it.
  async function dbClaim(path,cb){try{if(db){const r=await db.doc(path).acquire({holder:uid+':'+Math.random().toString(36).slice(2,8),ttlMs:8000});if(!r.acquired){cb('0');return}const s=await db.doc(path).get();cb(s.exists?JSON.stringify(s.data()):'0')}
      else{const v=localStorage.getItem(lsKey(path));cb(v||'0')}}catch(e){cb('0')}}
  // ---- the town: who else is walking around right now
  let hub=null,hubBc=null,hubPeers=new Map(),hubCb=null,hubMine={},hubT=null;
  function hubEmit(){if(!hubCb)return;const arr=[];hubPeers.forEach((v,k)=>{if(k!==me&&k!==uid)arr.push({id:k,p:v})});hubCb(JSON.stringify(arr))}
  let hubGen=0;
  async function hubJoin(name,cb){hubLeave();const gen=++hubGen;hubCb=cb;hubPeers=new Map();
    try{const c=window.claude;const r=c&&c.use?await c.use('room'):null;if(gen!==hubGen)return;if(r&&r.join){const h=await r.join(name);
      if(gen!==hubGen){try{h.leave()}catch(e){}return}hub=h;
      hub.onPeers(ch=>{hubPeers=new Map();for(const p of ch.peers){if(p.isMe)continue;const pr=p.presence||{};if(pr.kt)hubPeers.set(String(p.peer),pr)}hubEmit()});return}}catch(e){hub=null}
    hubBc=new BroadcastChannel('kinfall-'+name);hubBc.onmessage=e=>{const m=e.data;if(!m)return;if(m.k==='p'){hubPeers.set(m.f,Object.assign({},m.d,{seen:Date.now()}));hubEmit()}else if(m.k==='bye'){hubPeers.delete(m.f);hubEmit()}};
    hubT=setInterval(()=>{const now=Date.now();let ch=false;hubPeers.forEach((v,k)=>{if(now-v.seen>6000){hubPeers.delete(k);ch=true}});if(ch)hubEmit()},1000)}
  function hubPresence(json){hubMine=JSON.parse(json);hubMine.kt=1;if(hub)hub.presence(hubMine).catch(()=>{});else if(hubBc)hubBc.postMessage({k:'p',f:uid||me,d:hubMine})}
  function hubLeave(){hubGen++;try{if(hub&&hub.leave)hub.leave()}catch(e){}hub=null;if(hubBc){hubBc.postMessage({k:'bye',f:uid||me});hubBc.close();hubBc=null}if(hubT){clearInterval(hubT);hubT=null}hubCb=null}
  return {ask,netStart,presence,emit,joinMatch,matchEmit,leaveMatch,whoami,hasRoom:()=>!!room,
    storeInit,dbGet,dbSet,dbDel,dbAdd,dbQuery,dbClaim,hubJoin,hubPresence,hubLeave};
})();
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG=/*GODOT_CONFIG*/{};
const engine=new Engine(GODOT_CONFIG);
(function(){const bar=document.querySelector('#bar i'),err=document.getElementById('err'),load=document.getElementById('load');
  const fail=e=>{console.error(e);err.hidden=false;err.textContent=(e&&e.message)||String(e);document.getElementById('msg').textContent='The game could not start.'};
  const missing=Engine.getMissingFeatures({threads:false});if(missing.length){fail('Missing browser features:\n'+missing.join('\n'));return}
  engine.startGame({onProgress:(c,t)=>{if(c>0&&t>0)bar.style.width=Math.min(100,c/t*100)+'%'}}).then(()=>{load.remove();document.getElementById('canvas').focus()},fail)})();
</script>
